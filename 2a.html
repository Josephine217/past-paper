<!DOCTYPE html>
<html>
<head>
    <title>2a - Internet Usage Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        /* Styling the table to look professional */
        table {
            border-collapse: collapse; /* Makes the borders single lines instead of double */
            width: 60%;
            margin-top: 20px;
        }
        
        /* Styling the cells */
        th, td {
            border: 1px solid black; /* Visible border */
            padding: 10px;
            text-align: left;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>2(a) Internet Usage Statistics in Kenya</h2>

    <!-- The Table -->
    <!-- The 'border="1"' attribute ensures a visible border even in older browsers -->
    <table border="1">
        <caption>County | Internet Users (millions) | % Penetration</caption>
        
        <thead>
            <!-- Shaded header row using bgcolor as requested -->
            <tr bgcolor="#d3d3d3">
                <th>County</th>
                <th>Internet Users (millions)</th>
                <th>% Penetration</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>Nairobi</td>
                <td>6.2</td>
                <td>72%</td>
            </tr>
            <tr>
                <td>Mombasa</td>
                <td>1.8</td>
                <td>55%</td>
            </tr>
            <tr>
                <td>Kisumu</td>
                <td>0.9</td>
                <td>41%</td>
            </tr>
            <tr>
                <td>Nakuru</td>
                <td>1.1</td>
                <td>48%</td>
            </tr>
            <tr>
                <td>Eldoret</td>
                <td>0.7</td>
                <td>39%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
